<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Status Progres - PT Padepokan Tujuh Sembilan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between relative">

    <!-- Header / Navbar -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="https://rekrutmenp79.github.io/EuricaP79" class="flex items-center space-x-3 cursor-pointer hover:opacity-80 transition">
                <img src="logo.jpg" alt="Logo" class="h-8 w-auto object-contain" onerror="this.src='logo.png'">
                <span class="font-semibold text-gray-900 tracking-tight text-sm sm:text-base">Recruitment Portal</span>
            </a>
            <nav class="hidden md:flex space-x-8 text-sm font-medium">
                <a href="https://rekrutmenp79.github.io/EuricaP79" class="text-gray-600 hover:text-indigo-600 transition">Beranda</a>
                <a href="https://tally.so/r/NpxbgQ" target="_blank" class="text-gray-600 hover:text-indigo-600 transition">Reference Check Form</a>
                <a href="status.html" class="text-indigo-600 font-semibold transition">Cek Status Progres</a>
            </nav>
            <div>
                <a href="pendaftaran.html" class="inline-flex items-center space-x-2 text-xs sm:text-sm font-medium text-emerald-700 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 px-3.5 py-2 rounded-xl transition duration-200 shadow-sm">
                    <svg class="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                    <span>Pendaftaran Akun</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-sm border border-gray-200 p-8 sm:p-10">
            
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold text-gray-900">Cek Status Progres Reference Check</h1>
                <p class="text-sm text-gray-500 mt-1">Masukkan email yang Anda daftarkan untuk melihat status verifikasi terkini.</p>
            </div>

            <!-- Form Cek Status -->
            <form id="statusForm" class="space-y-4">
                <div>
                    <label for="checkEmail" class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-2">Email Kandidat</label>
                    <input type="email" id="checkEmail" required placeholder="nama@gmail.com" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-sm">
                </div>

                <button type="submit" id="submitBtn"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl transition duration-200 shadow-sm text-sm">
                    Cek Status Sekarang
                </button>
            </form>

            <!-- Container Hasil Pengecekan -->
            <div id="alertContainer" class="mt-4 hidden">
                <div id="alertCard" class="p-4 rounded-xl border text-sm"></div>
            </div>

            <div class="text-center mt-6">
                <a href="https://rekrutmenp79.github.io/EuricaP79" class="text-xs text-gray-400 hover:text-gray-600 transition">&larr; Kembali ke Beranda Utama</a>
            </div>

        </div>
    </main>

    <!-- WhatsApp Button -->
    <a href="https://wa.me/6282123758753?text=Halo%20Tim%20HR%20PT%20Padepokan%20Tujuh%20Sembilan,%20saya%20ingin%20menanyakan%20terkait%20status%20rekrutmen%20saya." 
       target="_blank" title="Hubungi HR"
       class="fixed bottom-6 right-6 z-50 flex items-center justify-center w-14 h-14 bg-emerald-500 hover:bg-emerald-600 text-white rounded-full shadow-lg transition-all">
        <svg class="w-8 h-8 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.124-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
    </a>

    <footer class="py-4 text-center text-xs text-gray-400 border-t border-gray-100">
        &copy; 2026 PT Padepokan Tujuh Sembilan. All rights reserved.
    </footer>

    <!-- Skrip Pengecekan Status -->
    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwl3XVVFBLzNNnNvfBX2WoWnJtRcT-VmUQ_bcAKAyIFqBft9AcgUNrTOWhRgmv_yQ4Z7w/exec';

        document.getElementById('statusForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const emailInput = document.getElementById('checkEmail').value.trim();
            const btn = document.getElementById('submitBtn');
            const alertContainer = document.getElementById('alertContainer');
            const alertCard = document.getElementById('alertCard');

            if (!emailInput) return;

            btn.innerText = "Memeriksa status...";
            btn.disabled = true;
            alertContainer.classList.add('hidden');

            try {
                const response = await fetch(`${SCRIPT_URL}?email=${encodeURIComponent(emailInput)}`);
                const result = await response.json();
                alertContainer.classList.remove('hidden');

                if (result.status === "success") {
                    const statusVal = result.bgc_status || "Under Review";
                    const isCompleted = statusVal.toLowerCase().includes("completed");

                    if (isCompleted) {
                        alertCard.className = "p-4 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-900";
                        alertCard.innerHTML = `
                            <p class="font-bold mb-1">Status: Completed</p>
                            <p class="text-xs mb-3">Halo, <b>${result.nama}</b>. Tahap Reference Check Anda telah selesai. Silakan lanjutkan ke halaman pendaftaran akun.</p>
                            <a href="pendaftaran.html" class="inline-block w-full text-center bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded-lg transition text-sm shadow-sm">
                                Lanjut Pendaftaran Akun &rarr;
                            </a>
                        `;
                    } else {
                        alertCard.className = "p-4 rounded-xl bg-amber-50 border border-amber-200 text-amber-900";
                        alertCard.innerHTML = `
                            <p class="font-bold mb-1">Status: Under Review</p>
                            <p class="text-xs">Halo, <b>${result.nama}</b>. Data Anda sedang dalam proses peninjauan. Mohon menunggu sejenak hingga verifikasi selesai.</p>
                        `;
                    }
                } else {
                    alertCard.className = "p-4 rounded-xl bg-rose-50 border border-rose-200 text-rose-900";
                    alertCard.innerHTML = `
                        <p class="font-bold mb-1">Email Tidak Ditemukan</p>
                        <p class="text-xs">${result.message || "Email belum terdaftar dalam sistem rekrutmen."}</p>
                    `;
                }
            } catch (error) {
                alertContainer.classList.remove('hidden');
                alertCard.className = "p-4 rounded-xl bg-rose-50 border border-rose-200 text-rose-900";
                alertCard.innerHTML = `<p class="text-xs">Terjadi kendala koneksi ke server database. Silakan coba beberapa saat lagi.</p>`;
            } finally {
                btn.innerText = "Cek Status Sekarang";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
